name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build DMG
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export MARKETING_VERSION="${GITHUB_REF_NAME#v}"
          fi
          export CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}"
          chmod +x scripts/build-dmg.sh
          ./scripts/build-dmg.sh

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/LeanSpeedo.dmg
          generate_release_notes: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeanSpeedo-dmg
          path: build/LeanSpeedo.dmg

      # Bump the Homebrew cask in rabacadabra/homebrew-tap.
      # Requires secret TAP_TOKEN: a fine-grained PAT with Contents: write on
      # the homebrew-tap repo. Skipped automatically if the secret is absent.
      - name: Bump Homebrew cask
        if: startsWith(github.ref, 'refs/tags/v') && env.TAP_TOKEN != ''
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 build/LeanSpeedo.dmg | cut -d' ' -f1)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/rabacadabra/homebrew-tap.git" tap
          cd tap
          sed -i '' -E "s/version \".*\"/version \"${VERSION}\"/" Casks/leanspeedo.rb
          sed -i '' -E "s/sha256 \".*\"/sha256 \"${SHA}\"/" Casks/leanspeedo.rb
          if git diff --quiet; then
            echo "Cask already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "leanspeedo ${VERSION}"
          git push
